name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: |
          xcodebuild test \
            -project FalconMD.xcodeproj \
            -scheme FalconMD \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=-

      - name: Build Release
        run: |
          xcodebuild build \
            -project FalconMD.xcodeproj \
            -scheme FalconMD \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=-

      - name: Package app
        run: |
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Release/FalconMD.app \
            FalconMD.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FalconMD
          path: FalconMD.app.zip
          if-no-files-found: error
