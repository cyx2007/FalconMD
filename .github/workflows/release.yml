name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Build universal Release app
        run: |
          xcodebuild build \
            -project FalconMD.xcodeproj \
            -scheme FalconMD \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=-

      - name: Verify version and architectures
        run: |
          app='build/DerivedData/Build/Products/Release/FalconMD.app'
          executable="$app/Contents/MacOS/FalconMD"
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$bundle_version" = "$tag_version"
          architectures=$(lipo -archs "$executable")
          case "$architectures" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "Expected arm64 and x86_64, got: $architectures" >&2; exit 1 ;;
          esac

      - name: Create DMG
        run: |
          app='build/DerivedData/Build/Products/Release/FalconMD.app'
          dmg_root="$RUNNER_TEMP/FalconMD-dmg"
          mkdir -p "$dmg_root"
          ditto "$app" "$dmg_root/FalconMD.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname FalconMD \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            FalconMD.dmg
          shasum -a 256 FalconMD.dmg > FalconMD.dmg.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            FalconMD.dmg \
            FalconMD.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "FalconMD $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
